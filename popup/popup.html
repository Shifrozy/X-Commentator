<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Commentator AI</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">X-Commentator</h1>
          <p class="header-subtitle">AI-Powered Comments</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="reloadExtBtn" class="reload-ext-btn" title="Reload extension & service worker" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <div class="status-badge" id="statusBadge">
          <span class="status-dot"></span>
          <span class="status-text">Inactive</span>
        </div>
      </div>
    </header>

    <!-- API Key Section -->
    <section class="settings-section">
      <label class="input-label" for="apiKey">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        Groq API Key
      </label>
      <div class="input-group">
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
        <button class="toggle-visibility" id="toggleKey" title="Show/Hide">
          <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <a href="https://console.groq.com/keys" target="_blank" class="api-link">
        Get your free API key →
      </a>
    </section>

    <!-- Model Selection -->
    <section class="settings-section">
      <div class="model-header-row">
        <label class="input-label" for="model">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
          </svg>
          AI Model
        </label>
        <button id="refreshModelsBtn" class="refresh-models-btn" title="Sync live models from Groq API" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span id="refreshModelsText">Sync Models</span>
        </button>
      </div>
      <select id="model">
        <optgroup label="Best for Comments (Instant & Free)">
          <option value="llama-3.1-8b-instant" selected>LLaMA 3.1 8B (Fastest & Best for Comments)</option>
        </optgroup>
        <optgroup label="Flagship & Intelligence">
          <option value="openai/gpt-oss-120b">OpenAI GPT-OSS 120B (Flagship Quality)</option>
          <option value="openai/gpt-oss-20b">OpenAI GPT-OSS 20B (Fast & Balanced)</option>
          <option value="qwen/qwen3.6-27b">Qwen 3.6 27B (Multilingual)</option>
          <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 Distill 70B (Reasoning)</option>
        </optgroup>
        <optgroup label="Lightweight Models">
          <option value="llama-3.2-3b-preview">LLaMA 3.2 3B (Fast & Compact)</option>
          <option value="llama-3.2-1b-preview">LLaMA 3.2 1B (Ultra-Lightweight)</option>
        </optgroup>
      </select>
      <div id="modelStatusMsg" class="model-status-msg"></div>
    </section>

    <!-- Tone Selection -->
    <section class="settings-section">
      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
        Comment Tone
      </label>
      <div class="tone-grid" id="toneGrid">
        <button class="tone-btn active" data-tone="friendly">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.5c0 0 1.5 2.5 5 2.5s5-2.5 5-2.5"/><circle cx="9" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="10"/></svg>
          <span class="tone-name">Friendly</span>
        </button>
        <button class="tone-btn" data-tone="professional">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
          <span class="tone-name">Professional</span>
        </button>
        <button class="tone-btn" data-tone="funny">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span class="tone-name">Funny</span>
        </button>
        <button class="tone-btn" data-tone="supportive">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="tone-name">Supportive</span>
        </button>
        <button class="tone-btn" data-tone="savage">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/><path d="M9 9.5c0 0 .5-1 1.5-1"/><path d="M15 9.5c0 0-.5-1-1.5-1"/></svg>
          <span class="tone-name">Savage</span>
        </button>
        <button class="tone-btn" data-tone="intellectual">
          <svg class="tone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span class="tone-name">Intellectual</span>
        </button>
      </div>
    </section>

    <!-- Language Selection -->
    <section class="settings-section">
      <label class="input-label" for="language">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Language
      </label>
      <select id="language">
        <option value="english">English</option>
        <option value="urdu">Urdu (Roman)</option>
        <option value="hindi">Hindi (Roman)</option>
        <option value="arabic">Arabic</option>
      </select>
    </section>

    <!-- Advanced Settings -->
    <details class="advanced-toggle">
      <summary>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Advanced Settings
      </summary>
      <div class="advanced-content">
        <div class="settings-section">
          <label class="input-label" for="customPrompt">Custom Instructions</label>
          <textarea id="customPrompt" placeholder="e.g., Always mention crypto, focus on tech topics..." rows="3"></textarea>
        </div>
        <div class="slider-group">
          <label class="input-label" for="temperature">
            Creativity: <span id="tempValue">0.8</span>
          </label>
          <input type="range" id="temperature" min="0.1" max="1.5" step="0.1" value="0.8">
          <div class="slider-labels">
            <span>Precise</span>
            <span>Creative</span>
          </div>
        </div>
        <div class="slider-group">
          <label class="input-label" for="maxTokens">
            Max Length: <span id="tokensValue">60</span> tokens (<span id="tokensChars">~180 chars</span>)
          </label>
          <input type="range" id="maxTokens" min="30" max="90" step="5" value="60">
          <div class="slider-labels">
            <span>Short (30)</span>
            <span>Standard (60)</span>
            <span>Max (90)</span>
          </div>
        </div>
      </div>
    </details>

    <!-- Save Button -->
    <button class="save-btn" id="saveBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Save Settings
    </button>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Powered by</span>
      <a href="https://console.groq.com" target="_blank">Groq</a>
      <span>•</span>
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
